name: Update US Macro & FOMC Brief

on:
  schedule:
    # Mon-Fri 06:05 & 14:05 EST / UTC 14:00 & 22:00 (after US pre-market & close)
    - cron: '0 14,22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-macro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit checks
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Fetch official FRED & Federal Reserve data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_macro.py

      - name: Validate generated macro/latest.json
        env:
          PYTHONPATH: scripts
        run: |
          python -c "import json, pathlib; from fetch_macro import validate_output; validate_output(json.loads(pathlib.Path('macro/latest.json').read_text(encoding='utf-8'))); print('Validated macro/latest.json OK')"

      - name: Commit and push updated macro JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macro/latest.json
          if git diff --cached --quiet; then
            echo "No macro changes to commit."
            exit 0
          fi
          git commit -m "chore(macro): update US macro indicators and FOMC summary"
          git pull --rebase --autostash origin main
          git push
